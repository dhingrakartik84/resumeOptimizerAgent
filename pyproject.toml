[project]
name = "resumeoptimizeragent"
version = "0.1.0"
description = "Resume optimization agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Your Name", email = "you@example.com" } ]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "ollama",
    "python-multipart",
    "pypdf",
    "python-docx",
    "streamlit",
    "requests"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ui*"]